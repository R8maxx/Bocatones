name: "🐛 Algo no va"
description: Un fallo, algo que se ve raro o que no hace lo que debería.
labels: ["bug"]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: ¿Qué pasa?
      description: Cuéntalo como se lo contarías a alguien en el bar.
      placeholder: Al marcar a alguien como que no puede ir, se le sigue viendo en los rodillos…
    validations:
      required: true

  - type: textarea
    id: que-esperabas
    attributes:
      label: ¿Qué esperabas que pasara?
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Cuantos más detalles, antes se arregla. Si hace falta más de una pantalla abierta, dilo.
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: input
    id: donde
    attributes:
      label: ¿Dónde?
      description: Navegador y dispositivo, y si era la web o la app instalada (PWA).
      placeholder: Chrome en Android, instalada en la pantalla de inicio
    validations:
      required: false

  - type: textarea
    id: consola
    attributes:
      label: ¿Sale algo en la consola?
      description: F12 → Console. Pega aquí lo que salga en rojo, si hay algo.
      render: text
    validations:
      required: false

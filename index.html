<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>&lt;BOCATONES/&gt;</title>
    <meta name="description" content="La lista de bocatas del bar, en directo: pedidos compartidos, precios, quién ha pagado y el sorteo de quién baja a recogerlos." />
    <meta name="robots" content="noindex" />

    <!-- iconos: antes el favicon era bocata.jpg, 1,7 MB de JPEG en cada carga en frío -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- previsualización al pegar el enlace en WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Bocatones" />
    <meta property="og:title" content="Bocatones — el pedido del bar, en directo" />
    <meta property="og:description" content="Pide tu bocata, mira la cola en tiempo real y sortea quién baja a por ellos." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary" />

    <!-- la barra del navegador acompaña al tema (lo ajusta el script de abajo) -->
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark light" />

    <!--
      Fuentes autoalojadas. Antes venían del CDN de Google, en modo bloqueante y
      con dos saltos de red antes del primer pintado: en una red interna sin
      salida a internet la app perdía su tipografía entera.
      JetBrains Mono es variable, así que un solo fichero cubre los pesos 400-800.
    -->
    <link rel="preload" href="/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/vt323.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      /*
       * Tema antes del primer pintado. El CSS declara el fondo oscuro por
       * defecto y la paleta real no se aplicaba hasta que corría el JS de Vue,
       * así que quien tuviera el preset claro veía un destello negro en cada
       * carga. Esto solo fija el fondo; useTheme.js recalcula el resto después.
       */
      try {
        var bg = localStorage.getItem('bocatones:bg')
        if (bg && /^#[0-9a-fA-F]{6}$/.test(bg)) {
          var r = parseInt(bg.slice(1, 3), 16)
          var g = parseInt(bg.slice(3, 5), 16)
          var b = parseInt(bg.slice(5, 7), 16)
          var dark = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 < 0.5
          document.documentElement.style.setProperty('--bg', bg)
          document.documentElement.style.setProperty('color-scheme', dark ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', bg)
        }
      } catch (e) {
        /* modo privado: se queda el tema por defecto */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 2rem; font-family: monospace; color: #f2f2f2">
        Bocatones necesita JavaScript para mostrar el pedido del día en directo.
        Actívalo y vuelve a cargar la página.
      </p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
